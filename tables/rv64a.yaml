module_name: rv64a_decoder
input: 32
output:
  - type_name: "rv32a_decode_out_t"
  - fields:
      [
        "legal",
        "lsu",
        "rs1",
        "rs2",
        "rd",
        "word",
        "lr",
        "sc",
        "swap",
        "add",
        "land",
        "lor",
        "lxor",
        "min",
        "max",
        "unsign",
        "dbl"
      ]
decodes:
  # Opcode AMO. aq and rl are don't-care.
  # LR reserves rs2 = 0. A nonzero rs2 is not a legal LR.
  # funct3 010 is a word. funct3 011 is a doubleword.
  - instr: "lr.w"
    match: "00010??00000?????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rd", "word", "lr"]
  - instr: "sc.w"
    match: "00011????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "sc"]
  - instr: "amoswap.w"
    match: "00001????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "swap"]
  - instr: "amoadd.w"
    match: "00000????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "add"]
  - instr: "amoxor.w"
    match: "00100????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "lxor"]
  - instr: "amoor.w"
    match: "01000????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "lor"]
  - instr: "amoand.w"
    match: "01100????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "land"]
  - instr: "amomin.w"
    match: "10000????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "min"]
  - instr: "amomax.w"
    match: "10100????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "max"]
  - instr: "amominu.w"
    match: "11000????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "min", "unsign"]
  - instr: "amomaxu.w"
    match: "11100????????????010?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "word", "max", "unsign"]
  - instr: "lr.d"
    match: "00010??00000?????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rd", "dbl", "lr"]
  - instr: "sc.d"
    match: "00011????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "sc"]
  - instr: "amoswap.d"
    match: "00001????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "swap"]
  - instr: "amoadd.d"
    match: "00000????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "add"]
  - instr: "amoxor.d"
    match: "00100????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "lxor"]
  - instr: "amoor.d"
    match: "01000????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "lor"]
  - instr: "amoand.d"
    match: "01100????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "land"]
  - instr: "amomin.d"
    match: "10000????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "min"]
  - instr: "amomax.d"
    match: "10100????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "max"]
  - instr: "amominu.d"
    match: "11000????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "min", "unsign"]
  - instr: "amomaxu.d"
    match: "11100????????????011?????0101111"
    decodes: ["legal", "lsu", "rs1", "rs2", "rd", "dbl", "max", "unsign"]
